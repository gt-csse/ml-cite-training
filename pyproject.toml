[project]
name = "ml-cite-training"
version = "0.1.0"
description = "Train BERT to extract four citation fields from the ML-cite natural corpus"
requires-python = ">=3.10,<3.13"
dependencies = [
    "huggingface-hub==0.36.2",
    "numpy<2",
    "torch==2.5.1",
    "transformers==4.51.3",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# CUDA wheels on Linux x86_64; PyPI wheels on macOS and other platforms.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]
